# =========================================================
# SkillTwin — Render Blueprint (single service + Postgres)
# =========================================================
# One web service serves the API and the UI from the same origin, so there is a
# single URL and no CORS to configure. Deploy with:
#   Render Dashboard -> New -> Blueprint -> pick this repo
#
# Two secrets are intentionally NOT in this file and must be pasted into the
# Render dashboard after the first deploy (they are marked `sync: false`):
#   OPENROUTER_API_KEY   - required for AI quizzes, resources and gap analysis
#   GITHUB_TOKEN         - optional, raises the GitHub API rate limit

databases:
  - name: skilltwin-db
    databaseName: skilltwin
    user: skilltwin
    plan: free

services:
  - type: web
    name: skilltwin
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Returns 200 with status "degraded" if the DB is unreachable, so a slow
    # database never fails the deploy outright.
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skilltwin-db
          property: connectionString

      # Signs JWTs. Generated by Render so the hardcoded development default in
      # backend/routers/auth.py is never used in production -- that default is
      # public, and anyone holding it can forge a session for any user.
      - key: SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production

      # Same-origin deploy: the browser only ever talks to this service, so no
      # cross-origin allowance is needed and the CORS middleware stays off.
      # Set this to a comma-separated origin list only if you later host the UI
      # somewhere else.
      - key: CORS_ORIGINS
        value: ""

      - key: OPENROUTER_API_KEY
        sync: false
      # Matches the model in local .env. The code default is
      # anthropic/claude-3.5-sonnet, which needs OpenRouter credit -- leaving it
      # unset here would silently switch the deploy to a paid model.
      - key: OPENROUTER_MODEL
        value: minimax/minimax-m3:free
      - key: GITHUB_TOKEN
        sync: false
